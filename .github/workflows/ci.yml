name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: 22.13.0
  COREPACK_VERSION: 0.34.7

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Corepack
        run: npm install --global corepack@${COREPACK_VERSION} --ignore-scripts

      - name: Enable Corepack
        run: corepack enable

      - name: Verify package manager
        run: |
          corepack --version
          pnpm --version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical validation
        run: pnpm validate

      - name: Verify release boundary
        run: pnpm verify:release

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Corepack
        run: npm install --global corepack@${COREPACK_VERSION} --ignore-scripts

      - name: Enable Corepack
        run: corepack enable

      - name: Verify package manager
        run: |
          corepack --version
          pnpm --version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm --dir e2e install --frozen-lockfile

      - name: Audit dependency trees
        run: pnpm audit:dependencies

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Corepack
        run: npm install --global corepack@${COREPACK_VERSION} --ignore-scripts

      - name: Enable Corepack
        run: corepack enable

      - name: Verify package manager
        run: |
          corepack --version
          pnpm --version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm --dir e2e install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir e2e exec playwright install chromium

      - name: Run browser E2E
        run: pnpm test:e2e
