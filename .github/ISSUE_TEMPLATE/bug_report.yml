name: Bug report
description: Report a reproducible problem with FloatPlay.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FloatPlay.

        **Do not report security vulnerabilities here.** Use the private security reporting flow described in `.github/SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reliably reproduces the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should FloatPlay have done?
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: e.g. 140.0.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: floatplay-version
    attributes:
      label: FloatPlay version or commit
      description: Use the installed extension version or the tested Git commit when developing locally.
      placeholder: e.g. 1.0.0 or 98e4723...
    validations:
      required: true
  - type: textarea
    id: other-extensions
    attributes:
      label: Other YouTube-modifying extensions
      description: List other extensions that modify YouTube, or write "None".
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Console errors or additional evidence
      description: Include FloatPlay-related console/runtime errors, screenshots, or other useful evidence. Remove personal or sensitive information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
        - label: I can reproduce this with the information provided above.
          required: true
